# Auto-merge — nobody is in the merge loop.
#
# Green, ready PRs merge themselves. The policy lives in ONE place
# for the whole fleet — bitbaum/fleet, scripts/ci/auto-merge-sweep.sh — and this
# file only says "run it, with these settings".
#
# This repo held its own copy of that script: 293 lines against the
# canonical's 446, differing on 161 lines. A fix landing in the
# canonical reached it never. That is the whole reason the sweep is called
# rather than copied — see bitbaum/fleet SHARED.md, which tracks this exact
# duplication as a ratchet.
#
# The triggers stay here because they are genuinely per-repo: `workflows:` must
# name the CI workflow EXACTLY as its own `name:` field spells it.
#
# No deploy_workflow: this repo has no deploy workflow to reconcile.
# To stop all of this: delete this file, or put a `hold` label on a PR.
name: Auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # */10, matching the rest of the fleet.
  #
  # This was hourly, on the stated grounds that "this repo is PRIVATE, so
  # Actions minutes are billed" — ~4,300 billed minutes a month at */10 against
  # a 2,000-minute allowance. The arithmetic was fine; the premise was not.
  # bitbaum/hamstercheek is PUBLIC (checked against the API on 2026-09-07, along
  # with every other repo in the org: only go-to-market and lifeops are
  # private). Scheduled runs on a public repo are free, so the constraint the
  # hourly cron existed to respect does not exist.
  #
  # Left as-is, this was the slowest-sweeping repo in the fleet for a reason
  # that had stopped being true — and the comment asserting it was the evidence
  # anyone would have trusted. If this repo is ever made private, put the cron
  # back to "0 * * * *" and restore the arithmetic above.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Declared on the CALLER as well as inside the reusable workflow: a called
# workflow's token is capped by what the caller grants, so relying on the
# callee's block alone can hand it a read-only token — and the sweep would then
# merge nothing while still exiting 0, which is indistinguishable from having
# nothing to merge.
permissions:
  contents: write # merge the PR
  pull-requests: write # read PR state, delete the branch
  actions: write # dispatch the re-arm
  checks: read # statusCheckRollup — only load-bearing on private repos
  statuses: read

jobs:
  sweep:
    uses: bitbaum/fleet/.github/workflows/auto-merge-sweep.yml@main
    with:
      base_branch: main
      ci_workflow: ci.yml
      # SPACE-separated: the sweep word-splits this. A comma would become one
      # bogus token and every dispatch would fail, while the sweep still
      # reported success.
      rearm_workflows: "ci.yml"
    secrets:
      # Why a PAT and not the default token: THROUGHPUT.
      #
      # A dispatch made with GITHUB_TOKEN triggers no workflows — the same rule
      # that makes the deploy reconciler necessary. So after the sweep merges a
      # PR and re-arms CI, that CI run's completion fires no workflow_run, and
      # nothing wakes the sweep to take the next PR. It waits for the cron, and
      # GitHub throttles scheduled workflows regardless of what the cron says:
      # measured in fleetcrown, sweeps land 50-65 minutes apart against */10.
      # A PAT-created dispatch does emit workflow_run, so a queue drains at CI
      # speed instead.
      #
      # NOT the reason, though an earlier version of this comment said so:
      # "GITHUB_TOKEN cannot merge a PR touching .github/workflows". That is
      # contradicted here — github-actions[bot] merged datacat#253 and
      # ai-kit#42, both of which change a workflow file. Recorded so the wrong
      # reason does not get re-derived from this file.
      #
      # Undefined resolves to empty and the reusable workflow falls back to
      # github.token, so this line is inert until the org secret exists.
      token: ${{ secrets.FLEET_PAT }}
